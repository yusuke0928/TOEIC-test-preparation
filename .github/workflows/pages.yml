name: Deploy to GitHub Pages

on:
  # main への push で公開する
  push:
    branches: [main]
  # Actions タブから手動でも実行できるようにする
  workflow_dispatch:

# GITHUB_TOKEN に Pages へデプロイする権限を与える
permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に 1 つだけ。進行中のデプロイは中断しない
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # ビルド工程は無い。リポジトリ直下をそのまま公開する
      # （.nojekyll があるため assets/ が Jekyll に無視されない）
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
